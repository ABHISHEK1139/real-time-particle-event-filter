name: CI Pipeline (Physics Validations)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies (single pass — no double torch install)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio torch_geometric || true

    - name: Mock Dataset Generation (CI Limit, physics-consistent)
      run: |
        # M is COMPUTED from kinematics via the invariant-mass relation, so the
        # label structure matches production. Old CI used random M (unrelated to
        # pt/eta/phi), which only proved "code runs", not physics correctness.
        python -c "
        import pandas as pd
        import numpy as np
        rng = np.random.default_rng(42)
        n = 1000
        pt1 = rng.uniform(5, 100, n); pt2 = rng.uniform(5, 100, n)
        eta1 = rng.uniform(-2.4, 2.4, n); eta2 = rng.uniform(-2.4, 2.4, n)
        phi1 = rng.uniform(-3.14, 3.14, n); phi2 = rng.uniform(-3.14, 3.14, n)
        M = np.sqrt(np.maximum(2*pt1*pt2*(np.cosh(eta1-eta2)-np.cos(phi1-phi2)), 1e-9))
        df = pd.DataFrame({'Run': 1, 'Event': np.arange(n), 'type1': 13, 'E1': 50.0,
          'px1': 10.0, 'py1': 10.0, 'pz1': 10.0, 'pt1': pt1, 'eta1': eta1, 'phi1': phi1, 'Q1': 1,
          'type2': -13, 'E2': 50.0, 'px2': -10.0, 'py2': -10.0, 'pz2': -10.0,
          'pt2': pt2, 'eta2': eta2, 'phi2': phi2, 'Q2': -1, 'M': M})
        df.to_csv('Dimuon_DoubleMu.csv', index=False)
        "

    - name: Execute Model Generation
      run: |
        python src/data_download.py
        python src/train_model.py

    - name: Run Formal Pytest Suite
      run: |
        python -m pytest tests/test_pipeline.py -v
