name: CI Pipeline (Physics Validations)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of burning minutes on them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # CI uses a local physics-consistent fixture instead of the 14 MB official
  # payload, so the pinned SHA-256 cannot apply. The scripts size-gate the
  # checksum themselves; this just states the intent explicitly.
  CERNDATA_VERIFY_CHECKSUM: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.5"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Caches the pip download cache, not the installed venv: correct across
          # the version matrix and across differing dependency sets.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch is ~200 MB instead of ~2.5 GB of CUDA wheels; the
          # GPU code paths in this repo all degrade cleanly when CUDA is absent.
          pip install -r requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Generate physics-consistent mock dataset
        # M is COMPUTED from kinematics via the invariant-mass relation, so the
        # label structure matches production. The old CI fixture drew a random
        # M unrelated to pt/eta/phi, which only proved "code runs".
        run: python tests/make_mock_dataset.py --rows 1000 --out Dimuon_DoubleMu.csv

      - name: Data ingestion + ROOT conversion
        run: python src/data_download.py

      - name: Train supervised model
        run: python src/train_model.py

      - name: Train unsupervised anomaly detector
        run: python src/anomaly_detection.py

      - name: Deterministic mass-cut baseline
        run: python src/baseline_physics_cut.py

      - name: Replay smoke test (needs the trained model)
        run: python src/realtime_simulation.py --batch-size 25000 --max-batches 1

      - name: Run pytest suite with coverage
        # NOTE: bare `--cov` only. Naming a file (e.g. `--cov=app.py`) makes
        # coverage resolve it as an importable module, which imports it before
        # conftest.py and crashes NumPy with "cannot load module more than once
        # per process" -> pytest exits 4 (usage error) and zero tests run.
        # The measurement scope lives in [tool.coverage.run] in pyproject.toml.
        run: |
          python -m pytest tests/ -v \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Verify required artifacts were produced
        run: |
          set -eu
          for f in z_boson_xgb_model.joblib Dimuon_DoubleMu.root \
                   results/metrics.md results/metrics.json \
                   results/anomaly_metrics.md results/anomaly_metrics.json \
                   models/z_boson_xgb_model.json \
                   plots/1_invariant_mass_spectrum.png plots/5_confusion_matrix.png \
                   plots/6_roc_curve.png plots/6b_physics_significance.png \
                   plots/7_anomaly_detection_roc.png; do
            test -s "$f" || { echo "::error::missing or empty artifact: $f"; exit 1; }
          done
          echo "All expected artifacts present."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-py${{ matrix.python-version }}
          path: |
            results/
            plots/
            models/
            pytest-report.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: warn

  container:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cern-zboson-ml:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Preflight: distinguishes "the build never produced a local image" from
      # "the container started and then failed", which are otherwise conflated
      # into a single opaque exit code.
      - name: Confirm the image is present in the local engine
        run: docker image inspect cern-zboson-ml:ci --format '{{.Id}} user={{.Config.User}} workdir={{.Config.WorkingDir}}'

      # Step names are quoted: an unquoted scalar containing ": " is parsed by
      # YAML as a nested mapping, which invalidates the whole workflow file and
      # makes GitHub report a failure with zero jobs run.
      - name: "Smoke test: every entry point imports inside the image"
        # Single-line `python -c` on purpose: a multi-line quoted argument is
        # easy to break in a `run: |` block, and a malformed command surfaces as
        # docker exit 125 ("requires at least 1 argument") rather than a Python
        # traceback.
        run: |
          docker run --rm cern-zboson-ml:ci python -c "import src.config, src.data_download, src.train_model, src.anomaly_detection, src.plot_mass_spectrum, src.realtime_simulation, src.speed_analysis, src.baseline_physics_cut; print('all entry points import cleanly')" 2>&1

      - name: "Smoke test: data volume is writable by the non-root user"
        run: |
          docker volume create cern-data
          docker run --rm -v cern-data:/data cern-zboson-ml:ci sh -c 'touch /data/.probe && rm /data/.probe && echo "data volume writable by uid $(id -u)"' 2>&1

      - name: "Smoke test: pipeline CMD runs to completion on the mock dataset"
        run: |
          # Generates a local fixture so the run needs no network, then exercises
          # the image's default CMD end to end (download -> train -> anomaly -> baseline).
          docker run --rm -e CERNDATA_VERIFY_CHECKSUM=0 -v cern-data:/data \
            cern-zboson-ml:ci sh -c '
              python tests/make_mock_dataset.py --rows 1000 --out /data/Dimuon_DoubleMu.csv
              python src/data_download.py && python src/train_model.py \
                && python src/anomaly_detection.py && python src/baseline_physics_cut.py
              test -s /app/results/metrics.json && echo "pipeline CMD produced metrics.json"
            ' 2>&1
